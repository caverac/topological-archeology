[project]
name = "disk-evolution"
version = "0.1.0"
description = "Semi-analytical protoplanetary disk evolution and planet formation (Miguel et al. 2011)"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=disk_evolution",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["disk_evolution"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    '^\s*\.\.\.\s*$',
]

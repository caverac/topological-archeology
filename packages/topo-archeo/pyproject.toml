[project]
name = "topo-archeo"
version = "0.1.0"
description = "Persistent homology of the protoplanetary disk inverse problem"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=topo_archeo",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["topo_archeo"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    '^\s*\.\.\.\s*$',
]

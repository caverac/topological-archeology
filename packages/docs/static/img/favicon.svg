<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#d4a520"/>
    </linearGradient>
    <style>
      text { font-family: 'Georgia', 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- Background: rounded square -->
  <rect x="4" y="4" width="92" height="92" rx="18" ry="18"
        fill="#0d1b2a" stroke="url(#g)" stroke-width="3"/>

  <!-- Topological symbol: simplicial complex -->
  <!-- Triangle (2-simplex) -->
  <polygon points="50,20 25,60 75,60"
           fill="none" stroke="#7eb8da" stroke-width="2"/>

  <!-- Vertices -->
  <circle cx="50" cy="20" r="3" fill="#d4a520"/>
  <circle cx="25" cy="60" r="3" fill="#d4a520"/>
  <circle cx="75" cy="60" r="3" fill="#d4a520"/>

  <!-- Extra edge forming H1 loop -->
  <line x1="25" y1="60" x2="50" y2="75" stroke="#7eb8da" stroke-width="2"/>
  <line x1="75" y1="60" x2="50" y2="75" stroke="#7eb8da" stroke-width="2"/>
  <circle cx="50" cy="75" r="3" fill="#d4a520"/>

  <!-- Label -->
  <text x="50" y="92" font-size="11" fill="url(#g)"
        text-anchor="middle" font-style="italic">TA</text>
</svg>
